<VirtualHost *:443>
    ServerName citas.patitas.lan
    ServerAlias srv-patitas.patitas.lan 192.168.50.10
    DocumentRoot /var/www/patitas/public

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/patitas.crt
    SSLCertificateKeyFile /etc/ssl/private/patitas.key

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"

    <Directory /var/www/patitas/public>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    <Directory /var/www/patitas/public/equipo>
        AuthType Basic
        AuthName "Zona del equipo de Patitas Club"
        AuthUserFile /etc/apache2/.htpasswd
        Require valid-user
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/patitas-error.log
    CustomLog ${APACHE_LOG_DIR}/patitas-access.log combined
</VirtualHost>
