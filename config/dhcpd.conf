# Servidor DHCP de Patitas Club
authoritative;
ddns-update-style none;
default-lease-time 86400;
max-lease-time 172800;
option domain-name "patitas.lan";

# VLAN 10 NEGOCIO: servidor, portátil de recepción y tablet del equipo
subnet 192.168.50.0 netmask 255.255.255.0 {
    range 192.168.50.100 192.168.50.150;
    option routers 192.168.50.1;
    option domain-name-servers 192.168.50.10;
}

# Reserva del portátil de recepción por su dirección MAC
host pc-recepcion {
    hardware ethernet 00:0C:29:BA:46:C1;
    fixed-address 192.168.50.20;
}

# VLAN 20 CLIENTES: las peticiones llegan por el ip helper-address del router
subnet 192.168.51.0 netmask 255.255.255.0 {
    range 192.168.51.100 192.168.51.200;
    option routers 192.168.51.1;
    option domain-name-servers 1.1.1.1, 8.8.8.8;
}
